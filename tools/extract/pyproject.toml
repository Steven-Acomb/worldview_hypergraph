[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldview-extract"
version = "0.1.0"
description = "LLM-assisted extraction: turn a plain-text document into a worldview-core file using the Claude API."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Stephen Acomb" }]
keywords = ["argumentation", "hypergraph", "extraction", "claude", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
# anthropic>=1.0: the tool uses structured outputs (output_config.format),
# which older 0.x releases of the SDK do not expose.
dependencies = ["worldview-core>=0.1", "anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
worldview-extract = "worldview_extract.cli:main"

[project.urls]
Homepage = "https://github.com/stephenacomb/worldview_hypergraph"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
