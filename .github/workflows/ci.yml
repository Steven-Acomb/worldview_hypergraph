# Continuous integration for the worldview-core monorepo.
#
# One job per component. The jobs are independent except that the editor
# needs a built SDK (it depends on it via file:../sdk/typescript), so the
# editor job builds the SDK itself rather than waiting on the typescript job.
#
# The python job also proves that the committed conformance vectors are the
# ones the reference implementation produces today: it regenerates them and
# fails if git sees any difference. See CONTRIBUTING.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch or pull request cancels the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Regenerate conformance vectors
        run: python conformance/generate.py

      - name: Committed vectors match the reference implementation
        run: |
          git diff --exit-code -- conformance/vectors
          if [ -n "$(git status --porcelain -- conformance/vectors)" ]; then
            git status --porcelain -- conformance/vectors
            echo "::error::conformance/vectors is out of date (new or missing files). Run python conformance/generate.py and commit the result."
            exit 1
          fi

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  editor:
    name: Editor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            editor/package-lock.json

      - name: Build the SDK (the editor depends on it via file:../sdk/typescript)
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build

      - name: Install
        working-directory: editor
        run: npm ci

      - name: Typecheck
        working-directory: editor
        run: npm run typecheck

      - name: Test
        working-directory: editor
        run: npm test

      - name: Build
        working-directory: editor
        env:
          VITE_BASE_PATH: /worldview_hypergraph/
        run: npm run build

      - name: Build produced editor/dist
        run: test -f editor/dist/index.html

  extract:
    name: Extraction tool
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tools/extract/pyproject.toml

      - name: Install (the tool depends on the root package)
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e "tools/extract[dev]"

      - name: Test
        run: python -m pytest tools/extract
