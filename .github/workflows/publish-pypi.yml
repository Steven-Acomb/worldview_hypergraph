# Publishes the Python packages to PyPI when a release tag is pushed.
#
#   py-vX.Y.Z       -> worldview-core      (the root package)
#   extract-vX.Y.Z  -> worldview-extract   (tools/extract)
#
# Authentication is PyPI Trusted Publishing (OIDC), so there is no API token
# to store. Each PyPI project must list this repository as a trusted publisher:
#   owner Steven-Acomb, repository worldview_hypergraph,
#   workflow publish-pypi.yml, environment pypi.
# The tag must equal the version in the package's pyproject.toml; the job
# refuses to publish otherwise.

name: Publish to PyPI

on:
  push:
    tags:
      - "py-v*"
      - "extract-v*"

permissions:
  contents: read

jobs:
  core:
    name: worldview-core
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/worldview-core/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Tag matches pyproject.toml version
        run: python .github/scripts/check_version.py pyproject.toml "${GITHUB_REF_NAME#py-v}"

      - name: Install and test
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build --outdir dist .

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  extract:
    name: worldview-extract
    if: startsWith(github.ref, 'refs/tags/extract-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/worldview-extract/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Tag matches tools/extract/pyproject.toml version
        run: python .github/scripts/check_version.py tools/extract/pyproject.toml "${GITHUB_REF_NAME#extract-v}"

      - name: Install and test (the tool depends on the root package)
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -e "tools/extract[dev]"
          python -m pytest tools/extract

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build --outdir dist tools/extract

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
