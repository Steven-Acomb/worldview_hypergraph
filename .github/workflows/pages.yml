# Deploys the web editor to GitHub Pages at
# https://steven-acomb.github.io/worldview_hypergraph/
#
# Requires Pages to be enabled for the repository with source "GitHub Actions"
# (Settings > Pages > Build and deployment > Source). GitHub creates the
# github-pages environment when Pages is enabled.

name: Deploy editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A deploy already in progress is not cancelled, so
# a production deploy never stops half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build editor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            editor/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build the SDK (the editor depends on it via file:../sdk/typescript)
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build

      - name: Build the editor
        working-directory: editor
        env:
          VITE_BASE_PATH: /worldview_hypergraph/
        run: |
          npm ci
          npm run build

      - name: Upload editor/dist
        uses: actions/upload-pages-artifact@v5
        with:
          path: editor/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
