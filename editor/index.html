<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Worldview editor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='19' width='10' height='8' rx='2' fill='%236b7280'/%3E%3Crect x='19' y='19' width='10' height='8' rx='2' fill='%236b7280'/%3E%3Crect x='11' y='4' width='10' height='8' rx='2' fill='%233b82f6'/%3E%3Cpath d='M8 19 L16 12 L24 19' stroke='%236b7280' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        var prefs = JSON.parse(localStorage.getItem("worldview-editor:prefs:v1") || "{}");
        if (prefs.theme === "light" || prefs.theme === "dark") {
          document.documentElement.dataset.theme = prefs.theme;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
